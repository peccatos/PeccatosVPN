[package]
name = "vpn-helper"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3.2"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls", "socks"] }
crossterm = "0.28.1"
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"